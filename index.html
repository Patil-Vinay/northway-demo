<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northway Platform Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#f3f5f9;--surface:#fff;--surface-2:#f8fafc;--ink:#0f172a;--ink-2:#334155;--muted:#64748b;--line:#e2e8f0;
  --brand:#0b2545;--brand-2:#13315c;--accent:#f59e0b;--accent-2:#fbbf24;
  --ok:#15803d;--ok-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;--bad:#b91c1c;--bad-bg:#fee2e2;
  --info:#1d4ed8;--info-bg:#dbeafe;--vio:#6d28d9;--vio-bg:#ede9fe;--cyan:#0e7490;--cyan-bg:#cffafe;--gray:#475569;--gray-bg:#f1f5f9;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06);--r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1020;--surface:#111a2e;--surface-2:#0d1527;--ink:#e6ebf3;--ink-2:#c3cbd8;--muted:#8d9ab0;--line:#1f2b44;
  --ok:#4ade80;--ok-bg:#0f2e1c;--warn:#fbbf24;--warn-bg:#33260a;--bad:#f87171;--bad-bg:#3a1414;--info:#93b4ff;--info-bg:#152449;
  --vio:#c4b5fd;--vio-bg:#261a4a;--cyan:#67e8f9;--cyan-bg:#0b2f38;--gray:#a3b0c2;--gray-bg:#1a243a;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{
  --bg:#0a1020;--surface:#111a2e;--surface-2:#0d1527;--ink:#e6ebf3;--ink-2:#c3cbd8;--muted:#8d9ab0;--line:#1f2b44;
  --ok:#4ade80;--ok-bg:#0f2e1c;--warn:#fbbf24;--warn-bg:#33260a;--bad:#f87171;--bad-bg:#3a1414;--info:#93b4ff;--info-bg:#152449;
  --vio:#c4b5fd;--vio-bg:#261a4a;--cyan:#67e8f9;--cyan-bg:#0b2f38;--gray:#a3b0c2;--gray-bg:#1a243a;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}
h3{font-size:15px;font-weight:700}
small,.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}

/* top bar */
.top{position:sticky;top:0;z-index:50;height:60px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:18px;padding:0 18px;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;text-decoration:none}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand span.l{font-weight:500;opacity:.8}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:rgba(245,158,11,.18);color:var(--accent-2);padding:3px 7px;border-radius:6px}
.views{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.views a{white-space:nowrap;text-decoration:none;padding:8px 12px;border-radius:9px;font-weight:600;font-size:13px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:7px}
.views a:hover{background:rgba(255,255,255,.08);color:#fff}
.views a.on{background:var(--accent);color:var(--brand)}
.top .reset{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:9px;padding:7px 11px;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap}
.top .reset:hover{background:rgba(255,255,255,.08)}

/* layout */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 60px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side-acct{display:flex;gap:10px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side-acct b{display:block;font-size:13px;line-height:1.2}
.avatar{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--accent-2);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink-2);font-weight:600;cursor:pointer;border:0;background:none;text-align:left;width:100%;white-space:nowrap}
.nav-i:hover{background:var(--surface-2)}
.nav-i.on{background:var(--gray-bg);color:var(--ink)}
.nav-i .badge{margin-left:auto}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.main{padding:28px;max-width:1320px;width:100%;margin:0 auto;min-width:0}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:16px}
.grid-2.even{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.kpi small{font-weight:600;font-size:12px}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.gap4{gap:4px}.gap16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}

/* chips & buttons */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.nodot::before{display:none}
.chip.gray{background:var(--gray-bg);color:var(--gray)}.chip.vio{background:var(--vio-bg);color:var(--vio)}.chip.cyan{background:var(--cyan-bg);color:var(--cyan)}
.chip.info{background:var(--info-bg);color:var(--info)}.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.warn{background:var(--warn-bg);color:var(--warn)}
.badge{background:var(--accent);color:var(--brand);font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#1b1300}
.btn.acc:hover{background:var(--accent-2)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--info);font-weight:600;cursor:pointer;background:none;border:0;padding:0}
input.in,select.in,textarea.in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--info);box-shadow:0 0 0 3px var(--info-bg)}
label.f{display:block;font-weight:600;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg .full{grid-column:1/-1}

/* tables & lists */
.tbl-wrap{overflow-x:auto;margin:0 -18px -18px;border-top:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;min-width:720px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:10px 18px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.tbl td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl select.in{padding:6px 8px;font-size:12px;width:auto}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover .ref{color:var(--info)}
.ref{font-weight:800;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}
.route{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:500}
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none;background:var(--gray-bg)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--gray-bg);padding:4px;border-radius:10px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:34px}

/* stepper & timeline */
.stepper{display:flex;align-items:flex-start;margin:6px 0 18px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.step::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step .dot{width:28px;height:28px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;z-index:1;margin-bottom:6px;color:#fff}
.step.done{color:var(--ink)}
.step.done::before,.step.cur::before{background:var(--ok)}
.step.done .dot{background:var(--ok);border-color:var(--ok)}
.step.cur{color:var(--ink)}
.step.cur .dot{border-color:var(--info);background:var(--info);box-shadow:0 0 0 5px var(--info-bg)}
.step.fail .dot{background:var(--bad);border-color:var(--bad)}
.step.fail{color:var(--bad)}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding-bottom:14px}
.tl-i::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--info)}
.tl-i.ok::before{border-color:var(--ok)}.tl-i.bad::before{border-color:var(--bad)}.tl-i.vio::before{border-color:var(--vio)}.tl-i.gray::before{border-color:var(--muted)}.tl-i.cyan::before{border-color:var(--cyan)}.tl-i.amber::before{border-color:var(--accent)}
.tl-i b{font-weight:600}
.tl-i small{display:block}
.addr{padding:12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line)}
.addr .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.addr b{display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:zoom-in;display:block;background:var(--gray-bg)}
.sigbox{background:#fff;border:1px dashed #cbd5e1;border-radius:10px;padding:6px;display:inline-block}
.sigbox img{display:block;height:56px}
.eta-box{text-align:right}
.eta-box b{font-size:28px;font-weight:800;display:block;letter-spacing:-.02em}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:11px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:13px}
.notice.info{background:var(--info-bg);color:var(--info)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}

/* 3D map */
.m3{position:relative;height:380px;border-radius:12px;overflow:hidden;background:#bcd6ee;isolation:isolate}
.m3 canvas.c3d{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:pan-y;cursor:grab}
.m3 canvas.c3d:active{cursor:grabbing}
.m3 > svg{width:100%;height:100%;display:block}
.m3-ui{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.m3-ui button{width:34px;height:34px;border-radius:9px;border:0;background:rgba(255,255,255,.92);color:#0b2545;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);display:grid;place-items:center}
.m3-ui button:hover{background:#fff}
.m3-hint{position:absolute;left:10px;bottom:10px;z-index:2;font-size:11px;font-weight:600;color:#0b2545;background:rgba(255,255,255,.85);padding:4px 8px;border-radius:7px;pointer-events:none}
.m3-live{position:absolute;left:10px;top:10px;z-index:2;font-size:11px;font-weight:800;color:#fff;background:rgba(11,37,69,.85);padding:5px 9px;border-radius:7px;display:flex;align-items:center;gap:6px;pointer-events:none}
.m3-live i{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 9px rgba(34,197,94,0)}}

/* home */
.hero{position:relative;height:min(80vh,740px);min-height:520px;background:#0b2545;overflow:hidden}
.hero .m3{position:absolute;inset:0;height:auto;border-radius:0}
.hero-copy{position:absolute;inset:0 auto 0 0;width:min(620px,100%);padding:56px 48px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:18px;background:linear-gradient(90deg,rgba(8,26,50,.94) 0%,rgba(8,26,50,.78) 62%,rgba(8,26,50,0) 100%);pointer-events:none;z-index:3}
.hero-copy > *{pointer-events:auto}
.hero-copy .eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2)}
.hero-copy h1{font-size:clamp(32px,4.4vw,52px);line-height:1.04;letter-spacing:-.035em;font-weight:800}
.hero-copy h1 em{font-style:normal;color:var(--accent)}
.hero-copy p{margin:0;font-size:16px;color:rgba(255,255,255,.8);max-width:470px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px}
.hero-stats div b{display:block;font-size:24px;font-weight:800}
.hero-stats div small{color:rgba(255,255,255,.65);font-weight:600}
.hero .m3-ui{top:auto;bottom:16px;right:16px;flex-direction:row}
.hero .m3-hint{left:auto;right:16px;bottom:60px}
.home-sec{max-width:1240px;margin:0 auto;padding:44px 24px}
.home-sec h2{font-size:26px;font-weight:800;letter-spacing:-.025em}
.home-sec > p{color:var(--muted);margin:6px 0 22px;max-width:640px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s;overflow:hidden}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(15,23,42,.12)}
.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:var(--accent-2)}
.tile h3{font-size:17px}
.tile p{margin:0;color:var(--muted);font-size:13px}
.tile .go{margin-top:auto;font-weight:700;color:var(--info);font-size:13px;display:flex;align-items:center;gap:4px}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative}
.flow-s{position:relative;padding:0 10px;text-align:center}
.flow-s .n{width:54px;height:54px;border-radius:16px;margin:0 auto 12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--brand);position:relative;z-index:1}
:root[data-theme="dark"] .flow-s .n{color:var(--accent-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .flow-s .n{color:var(--accent-2)}}
.flow-s::after{content:"";position:absolute;top:27px;left:calc(50% + 34px);width:calc(100% - 68px);border-top:2px dashed var(--line)}
.flow-s:last-child::after{display:none}
.flow-s b{display:block;font-size:14px}
.flow-s small{display:block;margin-top:4px}
.flow-s.auto .n{background:var(--accent);border-color:var(--accent);color:#1b1300}

/* driver */
.drv-wrap{display:grid;grid-template-columns:minmax(260px,380px) auto;gap:40px;justify-content:center;align-items:start;padding:28px}
.drv-side .card{margin-bottom:14px}
.drv-side ol{padding-left:18px;margin:8px 0 0}
.drv-side li{margin-bottom:8px;color:var(--ink-2)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700}
.sw{width:42px;height:24px;border-radius:999px;background:#cbd5e1;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--bad)}
.sw.on::after{left:21px}
.phone{width:390px;height:812px;border-radius:52px;background:#05070d;padding:12px;box-shadow:0 30px 60px rgba(2,6,23,.35),inset 0 0 0 2px #2a3245;position:sticky;top:80px}
.phone-in{width:100%;height:100%;border-radius:41px;overflow:hidden;background:#f4f6fa;display:flex;flex-direction:column;position:relative;color:#0f172a}
.sbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-weight:700;font-size:14px;background:#0b2545;color:#fff}
.sbar .notch{width:110px;height:28px;background:#05070d;border-radius:20px;position:absolute;left:50%;top:8px;transform:translateX(-50%)}
.sbar .sig{display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer;background:none;border:0;color:#fff;padding:0}
.sbar .sig.off{color:#fca5a5}
.app-scr{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.d-head{background:#0b2545;color:#fff;padding:12px 18px 18px}
.d-head h2{font-size:22px;font-weight:800}
.d-head small{color:rgba(255,255,255,.7)}
.d-head .back{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:9px;padding:6px 10px 6px 6px;display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:13px;cursor:pointer;margin-bottom:10px}
.d-body{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}
.d-card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.08);border:1px solid #e5e9f0;color:#0f172a}
.d-card.tap{cursor:pointer}
.d-card.tap:active{transform:scale(.99)}
.d-card .chip.vio{background:#ede9fe;color:#6d28d9}.d-card .chip.cyan{background:#cffafe;color:#0e7490}.d-card .chip.info{background:#dbeafe;color:#1d4ed8}.d-card .chip.ok{background:#dcfce7;color:#15803d}.d-card .chip.bad{background:#fee2e2;color:#b91c1c}.d-card .chip.warn{background:#fef3c7;color:#b45309}
.d-sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin:4px 2px -2px}
.d-addr{display:flex;gap:10px}
.d-addr .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.d-addr b{display:block}
.d-addr small{color:#64748b}
.d-actions{display:flex;gap:8px;margin-top:10px}
.d-actions button{flex:1;border:1px solid #e2e8f0;background:#f8fafc;border-radius:10px;padding:9px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:#0b2545}
.d-note{background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:12px;padding:12px;font-size:13px}
.d-foot{padding:12px 14px 22px;background:#fff;border-top:1px solid #e5e9f0;display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0}
.d-btn{width:100%;height:54px;border-radius:14px;border:0;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;background:#0b2545;color:#fff}
.d-btn.acc{background:#f59e0b;color:#1b1300}
.d-btn.ghost{background:#fff;color:#b91c1c;border:1.5px solid #fecaca;height:46px;font-size:14px}
.d-btn:disabled{opacity:.4;cursor:not-allowed}
.d-in{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid #e2e8f0;background:#fff;font-size:15px;color:#0f172a;outline:none}
.d-in:focus{border-color:#1d4ed8}
.d-lab{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between;color:#0f172a}
.d-lab small{color:#64748b;font-weight:600}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shot{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#e2e8f0}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(15,23,42,.7);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.shot-add{aspect-ratio:1;border-radius:12px;border:2px dashed #cbd5e1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#475569;font-weight:700;font-size:12px;cursor:pointer;background:#f8fafc;text-align:center;padding:4px}
.shot-add:hover{border-color:#1d4ed8;color:#1d4ed8}
#sig{width:100%;height:150px;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;touch-action:none;display:block;cursor:crosshair}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer;color:#0f172a}
.chk input{width:20px;height:20px;accent-color:#0b2545}
.reason{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid #e2e8f0;border-radius:12px;background:#fff;font-weight:600;cursor:pointer;color:#0f172a}
.reason:has(input:checked){border-color:#b91c1c;background:#fef2f2}
.reason input{accent-color:#b91c1c;width:18px;height:18px}
.offbar{background:#7f1d1d;color:#fecaca;font-size:12px;font-weight:700;padding:7px 14px;display:flex;gap:6px;align-items:center}
.syncbar{background:#fef3c7;color:#78350f;font-size:12px;font-weight:700;padding:7px 14px}
.done-scr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px;color:#0f172a}
.done-scr .big{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:#dcfce7;color:#15803d}
.done-scr .big.warn{background:#fef3c7;color:#b45309}
.done-scr .big.bad{background:#fee2e2;color:#b91c1c}
.done-scr ul{text-align:left;padding:0;list-style:none;margin:6px 0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.done-scr li{display:flex;gap:8px;align-items:center}
.done-scr li svg{color:#15803d;flex:none}
.login-ph{flex:1;background:linear-gradient(180deg,#0b2545,#13315c);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:30px;gap:14px}
.login-ph .d-in{border-color:transparent}

/* customer login */
.login{min-height:calc(100vh - 60px);display:grid;grid-template-columns:1fr 1fr}
.login-l{background:var(--brand);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;gap:16px;position:relative;overflow:hidden}
.login-l h1{font-size:38px;line-height:1.08;letter-spacing:-.03em}
.login-l h1 em{font-style:normal;color:var(--accent)}
.login-l p{color:rgba(255,255,255,.75);max-width:420px;margin:0;font-size:15px}
.login-l ul{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:10px}
.login-l li{display:flex;gap:10px;align-items:center;color:rgba(255,255,255,.88);font-weight:500}
.login-l li svg{color:var(--accent)}
.login-r{display:grid;place-items:center;padding:30px}
.login-card{width:min(400px,100%)}

/* modal, drawer, toast */
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.6);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:18px;width:min(860px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.modal-b{padding:22px;background:var(--surface-2)}
.x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.drawer-bg{position:fixed;inset:60px 0 0 0;background:rgba(2,6,23,.35);z-index:60}
.drawer{position:fixed;top:60px;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:61;box-shadow:-20px 0 50px rgba(0,0,0,.2);overflow-y:auto;animation:slin .2s ease-out}
@keyframes slin{from{transform:translateX(40px);opacity:0}}
.drawer-h{position:sticky;top:0;background:var(--surface);padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}
.drawer-b{padding:20px;display:flex;flex-direction:column;gap:16px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 32px))}
.toast{background:#0b2545;color:#fff;border-radius:13px;padding:12px 14px;display:flex;gap:11px;box-shadow:0 12px 30px rgba(2,6,23,.35);animation:tin .25s ease-out;border-left:4px solid var(--accent)}
.toast.ok{border-left-color:#22c55e}.toast.warn{border-left-color:#f59e0b}.toast.bad{border-left-color:#ef4444}
.toast .ti{color:var(--accent-2);flex:none;margin-top:1px}
.toast b{display:block;font-size:13px}
.toast small{color:rgba(255,255,255,.7);font-size:12px}
@keyframes tin{from{transform:translateY(12px);opacity:0}}

/* email */
.email{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.email-meta{padding:14px 18px;border-bottom:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:3px}
.email-meta h3{font-size:17px;margin-bottom:6px}
.email-auto{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-bg);padding:3px 8px;border-radius:6px;margin-top:6px;width:max-content}
.email-body{background:#eef2f7;padding:22px}
.email-paper{background:#fff;color:#0f172a;max-width:560px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(15,23,42,.08)}
.email-paper .eh{background:#0b2545;color:#fff;padding:16px 22px;display:flex;align-items:center;gap:10px}
.email-paper .eb{padding:22px;font-size:14px}
.email-paper .eb p{margin:0 0 12px}
.email-paper table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 16px}
.email-paper td{padding:7px 0;border-bottom:1px solid #eef2f7}
.email-paper td:first-child{color:#64748b;width:38%}
.email-paper .ebtn{display:inline-block;background:#f59e0b;color:#1b1300;font-weight:800;padding:10px 16px;border-radius:9px;text-decoration:none;cursor:pointer;border:0;margin-right:6px}
.att{display:inline-flex;align-items:center;gap:6px;border:1px solid #e2e8f0;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700;margin:4px 6px 0 0;cursor:pointer;background:#f8fafc;color:#0f172a}
.inbox{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.mail-i{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.mail-i:hover{background:var(--surface-2)}
.mail-i.on{background:var(--info-bg)}
.mail-i.unread b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--info);margin-right:6px;vertical-align:middle}

/* POD document */
.pod-doc{background:#fff;color:#111827;width:100%;max-width:760px;margin:0 auto;padding:34px 38px;border-radius:6px;box-shadow:0 4px 24px rgba(15,23,42,.12);font-size:12.5px}
.pod-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0b2545;padding-bottom:16px;margin-bottom:18px;gap:16px}
.pod-top .co{display:flex;gap:10px;align-items:center}
.pod-top .co b{font-size:20px;font-weight:800;color:#0b2545;letter-spacing:-.02em;display:block;line-height:1}
.pod-top .co small{color:#6b7280;font-size:11px}
.pod-title{text-align:right}
.pod-title .t{font-size:11px;font-weight:800;letter-spacing:.14em;color:#d97706}
.pod-title .n{font-size:22px;font-weight:800;color:#0b2545;font-family:ui-monospace,Consolas,monospace}
.pod-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #e5e7eb;border-radius:8px;margin-bottom:14px}
.pod-grid > div{padding:9px 11px;border-right:1px solid #e5e7eb}
.pod-grid > div:last-child{border-right:0}
.pod-k{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:#6b7280;font-weight:700;margin-bottom:3px}
.pod-v{font-weight:700}
.pod-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.pod-box{border:1px solid #e5e7eb;border-radius:8px;padding:11px}
.pod-ok{display:flex;align-items:center;gap:8px;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;padding:10px 12px;border-radius:8px;font-weight:700;margin-bottom:14px}
.pod-ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.pod-ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
.pod-sig{display:flex;gap:16px;align-items:flex-end}
.pod-sig img{height:70px;border-bottom:1px solid #9ca3af}
.pod-foot{margin-top:18px;padding-top:12px;border-top:1px solid #e5e7eb;color:#6b7280;font-size:10.5px;display:flex;justify-content:space-between;gap:10px}

/* plan */
.arch{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;position:relative}
.arch .card h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.arch ul,.plan-ul{margin:0;padding-left:18px;color:var(--ink-2)}
.arch li,.plan-ul li{margin-bottom:5px}
.phase{display:grid;grid-template-columns:140px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.phase:last-child{border-bottom:0}
.phase .w{font-weight:800;color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:38px;border-radius:7px 7px 3px 3px;background:var(--brand-2)}
:root[data-theme="dark"] .bar i{background:#3b5c8f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar i{background:#3b5c8f}}
.bar.today i{background:var(--accent)}
.bar small{font-size:11px;font-weight:600}
.bar b{font-size:12px}
.drv-card .av{width:44px;height:44px;border-radius:12px;background:var(--brand);color:var(--accent-2);display:grid;place-items:center;font-weight:800;flex:none}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 30px}

/* app polish */
body{background:radial-gradient(1100px 520px at 100% -10%,rgba(255,138,61,.07),transparent 60%),radial-gradient(900px 480px at -10% 0%,rgba(80,110,255,.06),transparent 60%),var(--bg);background-attachment:fixed}
.top{background:linear-gradient(90deg,#070d26,#0f1a44 60%,#141f52);border-bottom:1px solid rgba(255,255,255,.07)}
.views a.on{background:linear-gradient(135deg,#ffb347,#ff7a3d);color:#1a0d00;box-shadow:0 6px 18px -6px rgba(255,122,61,.75)}
.tag{background:rgba(255,138,61,.16);color:#ffc061}
.btn.acc,.d-btn.acc{background:linear-gradient(135deg,#ffb347,#ff7a3d);border-color:transparent;color:#1a0d00;box-shadow:0 8px 22px -10px rgba(255,122,61,.8)}
.btn.acc:hover{background:linear-gradient(135deg,#ffc061,#ff8a50)}
.btn.pri{background:linear-gradient(135deg,#1b2d6b,#0a1330);border-color:#0a1330}
.btn.pri:hover{background:linear-gradient(135deg,#243a85,#0f1a44)}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,#ffb347,#ff7a3d,#ff4f8b)}
.kpi::after{content:"";position:absolute;right:-36px;top:-36px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,138,61,.13),transparent 70%);pointer-events:none}
.kpi.alert::before{background:linear-gradient(90deg,#f87171,#dc2626)}
.nav-i.on{background:linear-gradient(90deg,rgba(255,138,61,.15),rgba(255,138,61,0) 85%);box-shadow:inset 3px 0 0 #ff8a3d}
.avatar,.drv-card .av,.tile .ic{background:linear-gradient(135deg,#1b2d6b,#0a1330)}
.badge{background:linear-gradient(135deg,#ffb347,#ff7a3d);color:#1a0d00}
.m3{box-shadow:inset 0 0 0 1px rgba(15,23,42,.06)}
.login-l{background:radial-gradient(600px 400px at 0% 100%,rgba(255,122,61,.28),transparent 60%),linear-gradient(160deg,#0a1330,#16245c)}
.d-head,.sbar,.login-ph{background:linear-gradient(135deg,#0a1330,#17286a)}
.step.cur .dot{background:#ff8a3d;border-color:#ff8a3d;box-shadow:0 0 0 5px rgba(255,138,61,.2)}

/* landing page */
.landing{background:#070b1a;color:#e7ecf7;overflow:hidden}
.hero2{position:relative;height:calc(100vh - 60px);min-height:640px;max-height:920px;overflow:hidden;background:#140f30}
.hero2 .m3{position:absolute;inset:0;height:auto;border-radius:0;background:#2c2560;box-shadow:none}
.hero2::after{content:"";position:absolute;inset:auto 0 0 0;height:180px;background:linear-gradient(0deg,#070b1a 5%,rgba(7,11,26,0));pointer-events:none;z-index:2}
.hero2-copy{position:absolute;left:0;top:0;bottom:0;width:min(660px,100%);padding:56px 56px 90px;display:flex;flex-direction:column;justify-content:center;gap:22px;z-index:3;background:linear-gradient(90deg,rgba(7,11,26,.94) 0%,rgba(7,11,26,.78) 55%,rgba(7,11,26,0) 100%);pointer-events:none}
.hero2-copy>*{pointer-events:auto}
.hero2 h1{font-size:clamp(40px,5.2vw,70px);line-height:.98;letter-spacing:-.045em;font-weight:800;color:#fff}
.grad{background:linear-gradient(90deg,#ffc061,#ff7a3d 50%,#ff4f8b);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:17px;color:#b4bfd9;max-width:500px;margin:0;line-height:1.55}
.pill{display:inline-flex;align-items:center;gap:8px;width:max-content;max-width:100%;padding:6px 13px 6px 10px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);font-size:12px;font-weight:700;color:#d2daf0;backdrop-filter:blur(8px)}
.pill > i{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 1.6s infinite}
.pill svg{color:#ffb347}
.btn.glow{background:linear-gradient(135deg,#ffb347,#ff7a3d 60%,#ff5e62);border:0;color:#1a0d00;box-shadow:0 12px 32px -10px rgba(255,106,61,.85);padding:14px 22px;font-size:14px;border-radius:13px;transition:transform .15s,box-shadow .15s}
.btn.glow:hover{transform:translateY(-2px);box-shadow:0 16px 38px -10px rgba(255,106,61,.95);background:linear-gradient(135deg,#ffc061,#ff8a50 60%,#ff6e70)}
.btn.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(10px);padding:14px 22px;font-size:14px;border-radius:13px}
.btn.glass:hover{background:rgba(255,255,255,.15)}
.stats2{display:flex;gap:34px;flex-wrap:wrap;padding-top:18px;border-top:1px solid rgba(255,255,255,.1)}
.stats2 b{display:block;font-size:32px;font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1.1}
.stats2 small{color:#8a96b6;font-weight:600;font-size:12px}
.float{position:absolute;z-index:3;display:block;text-decoration:none;color:#fff;background:rgba(14,18,44,.6);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border-radius:18px;padding:15px;box-shadow:0 24px 60px -16px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);animation:bob 7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.float b{display:block;font-size:14px}
.float small{color:#a9b4cf;font-size:12px}
.float.f1{right:4%;top:8%;width:280px;animation-delay:-1s}
.float.f2{right:26%;bottom:13%;width:290px;animation-delay:-3.5s}
.float.f3{right:3.5%;bottom:22%;width:260px;animation-delay:-5.5s}
.fl-k{font-size:12px;font-weight:700;color:#ffc061;display:flex;align-items:center;gap:6px}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 1.6s infinite}
.fl-big{font-size:40px;font-weight:800;letter-spacing:-.04em;margin:4px 0 2px}
.fl-route{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:10px}
.fl-route i{flex:1;height:2px;background:linear-gradient(90deg,#8b5cf6,#ff7a3d);border-radius:2px}
.prog{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#ffb347,#ff7a3d);box-shadow:0 0 12px rgba(255,122,61,.8);transition:width 1s linear}
.okc,.mailc{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.okc{background:rgba(34,197,94,.18);color:#4ade80}.mailc{background:rgba(96,165,250,.18);color:#93c5fd}
.fl-pod{display:flex;gap:10px;margin-top:12px;align-items:stretch}
.fl-pod > img{width:120px;height:90px;object-fit:cover;border-radius:10px;display:block}
.fl-sig{flex:1;background:#fff;border-radius:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6px}
.fl-sig img{width:100%;height:46px;object-fit:contain}
.fl-sig small{color:#475569!important;font-weight:700;font-size:11px}
.fl-sub{margin-top:10px;font-size:13px;font-weight:600;color:#e2e8f0;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.scroll-cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%) rotate(90deg);z-index:4;color:rgba(255,255,255,.6);animation:cue 2s ease-in-out infinite}
@keyframes cue{50%{transform:translateX(-50%) rotate(90deg) translateX(6px)}}
.hero2 .m3{isolation:auto}.hero2 .m3-ui,.hero2 .m3-hint{z-index:5}
.hero2 .m3-ui{top:auto;bottom:22px;right:22px;flex-direction:row}
.hero2 .m3-ui button{background:rgba(255,255,255,.12);color:#fff;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18)}
.hero2 .m3-hint{left:auto;right:22px;bottom:66px;background:rgba(14,18,44,.6);color:#cbd5f5}
.marquee{border-block:1px solid rgba(255,255,255,.07);background:#0a0f24;overflow:hidden;padding:16px 0;position:relative}
.marquee::before,.marquee::after{content:"";position:absolute;top:0;bottom:0;width:120px;z-index:1}
.marquee::before{left:0;background:linear-gradient(90deg,#0a0f24,transparent)}.marquee::after{right:0;background:linear-gradient(-90deg,#0a0f24,transparent)}
.mq{display:flex;gap:44px;width:max-content;animation:mq 40s linear infinite;padding-right:44px}
.mq span{display:flex;align-items:center;gap:9px;color:#8f9bbb;font-weight:700;font-size:14px;white-space:nowrap}
.mq svg{color:#ff8a3d}
@keyframes mq{to{transform:translateX(-50%)}}
.sec2{max-width:1240px;margin:0 auto;padding:90px 24px 10px}

  allocated:{s:`Driver allocated — ${j.ref}`,p:[`${d?d.name.split(' ')[0]:'Your driver'} (${d?d.vehicle+', '+d.reg:''}) will collect your goods from ${j.from.name}, ${from}, by ${fmt.time(j.collectBy)}.`,`You can follow progress live using the tracking link below.`],tr:'Operations allocated a driver',att:[]},
  collected:{s:`Collected and on its way — ${j.ref}`,p:[`Your goods were collected from ${j.from.name} at ${fmt.time(t)} and are on their way to ${j.to.name}, ${to}.`,`The collection photo is attached. Track the vehicle live with the link below.`],tr:'Driver confirmed collection in the app',att:[`${j.ref}-collection.jpg`]},
  delivered:{s:`Delivered — Proof of Delivery for ${j.ref}`,p:[`Your delivery to ${j.to.name}, ${to} was completed at ${fmt.time(podT)} on ${fmt.date(podT)}${j.pod?.safePlace?', left in a safe place':`, signed for by ${j.pod?.recipient||'the recipient'}`}.`,`Your Proof of Delivery and delivery photographs are attached and saved in your customer portal.`],tr:'Driver submitted the POD in the app',att:[`${j.pod?.id||'POD'}.pdf`,...photos]},
  failed:{s:`Delivery attempt unsuccessful — ${j.ref}`,p:[`We attempted delivery to ${j.to.name}, ${to} at ${fmt.time(j.failure?.t||t)} but couldn't complete it: ${j.failure?.reason||''}.`,`Our operations team will contact you to arrange a redelivery. A photo from the attempt is attached.`],tr:'Driver reported a failed attempt in the app',att:photos.slice(-1)},
 };

function genSig(name){
 const key='sig|'+name;if(imgCache[key])return imgCache[key];
 const c=document.createElement('canvas');c.width=360;c.height=120;const g=c.getContext('2d');const r=rng(hashStr(name));
 g.strokeStyle='#1e3a8a';g.lineWidth=2.4;g.lineCap='round';g.lineJoin='round';g.beginPath();
 let x=24,y=70;g.moveTo(x,y);
 for(const ch of name){if(ch===' '){x+=16;g.moveTo(x,y);continue}const h=/[A-Z]/.test(ch)?42:22+r()*10;const w=12+r()*10;
  g.bezierCurveTo(x+w*.2,y-h,x+w*.9,y-h*.9,x+w*.6,y);g.bezierCurveTo(x+w*.4,y+8,x+w,y+6,x+w+3,y-6);x+=w}

}

function stampFile(file,meta){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,960/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const g=c.getContext('2d');g.drawImage(im,0,0,c.width,c.height);stamp(g,c.width,c.height,meta);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

// actions on jobs
function addEv(j,e){j.events.push(e)}
function applyDriver(a){
 const j=J(a.ref);if(!j)return;const d=D(j.driver);const syn=a.synced?` (synced ${fmt.time(a.synced)})`:'';
 if(a.type==='collect'){j.status='collected';j.photos.collection.push(...a.photos);addEv(j,ev(a.t,'collected',`Collected by ${d.name} — ${a.pieces} piece(s), ${a.photos.length} photo(s)${syn}`,'Driver app'));sendEmail(j,'collected')}
 if(a.type==='depart'){j.status='in_transit';j.progress=.01;addEv(j,ev(a.t,'in_transit',`Departed for ${cityN(j.to.city)} — live tracking active${syn}`,'Driver app'))}
 if(a.type==='deliver'){j.status='delivered';j.progress=1;j.photos.delivery.push(...a.photos);
  j.pod={id:'POD-'+j.ref.split('-')[1],recipient:a.recipient,sig:a.sig,t:a.t,notes:a.notes,safePlace:a.safePlace};
  addEv(j,ev(a.t,'delivered',(a.safePlace?`Delivered — left in safe place (${esc(a.recipient)})`:`Delivered — signed for by ${esc(a.recipient)}`)+syn,'Driver app'));
  addEv(j,ev((a.synced||a.t)+3000,'pod','Proof of Delivery generated and emailed to customer','System'));sendEmail(j,'delivered')}
 if(a.type==='fail'){j.status='failed';j.failure={reason:a.reason,note:a.note,t:a.t};j.photos.delivery.push(...a.photos);addEv(j,ev(a.t,'failed',`Delivery attempt failed — ${a.reason}${syn}`,'Driver app'));sendEmail(j,'failed')}
 save();
}
function dispatch(a){
 if(S.offline){S.queue.push(a);save();toast('Saved on the phone','No signal — it will upload automatically when signal returns','warn')}
 else applyDriver(a);
}
function setOffline(v){
 S.offline=v;
 if(!v&&S.queue.length){const q=S.queue.splice(0);const now=Date.now();q.forEach(a=>applyDriver({...a,synced:now}));toast(`Back online — synced ${q.length} update${q.length>1?'s':''}`,'Customer emails and PODs sent automatically','sync')}
 else if(v)toast('Driver phone is offline','Updates will be stored on the device','warn');
 save();render();
}
function allocate(ref,did){
 const j=J(ref);if(!j||!did)return;const d=D(did);const first=j.status==='booked';
 j.driver=did;if(first)j.status='allocated';

  <div class="tabs">${[['active','Active'],['history','History'],['all','All']].map(([k,l])=>`<button class="${UI.custFilter===k?'on':''}" data-act="custFilter" data-f="${k}">${l}</button>`).join('')}</div>

  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Reference</th><th>Collection</th><th>Delivery</th><th>Status</th><th>Time</th><th>POD</th></tr></thead><tbody id="cust-tbody">${custRows()}</tbody></table></div>

function stepper(j){
 const idx=STEPS.indexOf(j.status);const failed=j.status==='failed';
 return `<div class="stepper">${STEPS.map((s,i)=>{let cls='';if(failed){cls=i<4?'done':'fail'}else if(i<idx||j.status==='delivered')cls='done';else if(i===idx)cls='cur';
  const lab=failed&&i===4?'Failed':ST[s].l.replace('Driver allocated','Allocated');
  return `<div class="step ${cls}"><div class="dot">${cls==='done'?I('check',14,3):cls==='fail'?I('x',14,3):''}</div><span>${lab}</span></div>`}).join('')}</div>`;
}
function timeline(j){
 const cm={booked:'gray',allocated:'vio',collected:'cyan',in_transit:'',delivered:'ok',failed:'bad',pod:'ok',note:'amber'};
 return `<div class="tl">${j.events.slice().sort((a,b)=>b.t-a.t).map(e=>`<div class="tl-i ${cm[e.status]??''}"><b>${e.text}</b><small>${fmt.dt(e.t)} · ${e.by}</small></div>`).join('')}</div>`;
}
function podPanel(j,admin){
 if(j.status==='failed')return `<div class="notice" style="background:var(--bad-bg);color:var(--bad)">${I('alert',18)}<div>Delivery attempt failed — <b>${esc(j.failure.reason)}</b><br><span style="font-weight:500">${esc(j.failure.note||'')}</span></div></div>${j.photos.delivery.length?`<div class="photos mt12">${j.photos.delivery.map((p,i)=>`<img src="${phSrc(p)}" alt="Attempt photo" data-act="photo" data-ref="${j.ref}" data-k="delivery" data-i="${i}">`).join('')}</div>`:''}`;
 if(!j.pod)return `<div class="notice info">${I('file',18)}<div>The Proof of Delivery will appear here automatically the moment the driver completes the delivery — and a copy will be emailed to ${admin?'the customer':'you'}.</div></div>
  ${j.photos.collection.length?`<div class="mt12"><small style="font-weight:700">Collection photos</small><div class="photos mt8">${j.photos.collection.map((p,i)=>`<img src="${phSrc(p)}" alt="Collection photo" data-act="photo" data-ref="${j.ref}" data-k="collection" data-i="${i}">`).join('')}</div></div>`:''}`;
 return `<div class="notice ok">${I('check',18)}<div>${j.pod.id} · delivered ${fmt.dt(j.pod.t)} · ${j.pod.safePlace?'left in safe place':'signed for by <b>'+esc(j.pod.recipient)+'</b>'}</div></div>
  <div class="photos mt12">${j.photos.delivery.map((p,i)=>`<img src="${phSrc(p)}" alt="Delivery photo" data-act="photo" data-ref="${j.ref}" data-k="delivery" data-i="${i}">`).join('')}${j.photos.collection.map((p,i)=>`<img src="${phSrc(p)}" alt="Collection photo" data-act="photo" data-ref="${j.ref}" data-k="collection" data-i="${i}">`).join('')}</div>
  ${j.pod.sig?`<div class="row mt12 wrap"><div class="sigbox"><img src="${sigSrc(j.pod.sig)}" alt="Signature"></div><small>${esc(j.pod.recipient)}</small></div>`:''}
  ${j.pod.notes?`<p style="margin:10px 0 0;font-size:13px"><b>Driver notes:</b> ${esc(j.pod.notes)}</p>`:''}
  <div class="row wrap mt12"><button class="btn pri sm" data-act="pod" data-ref="${j.ref}">${I('file',14)} View POD</button><button class="btn sm" data-act="podPrint" data-ref="${j.ref}">${I('download',14)} Download PDF</button><button class="btn sm" data-act="dlPhotos" data-ref="${j.ref}">${I('image',14)} Download photos</button>${admin?`<button class="btn sm" data-act="resend" data-ref="${j.ref}">${I('send',14)} Resend POD</button>`:''}</div>`;
}
function addrBlock(k,p,ic,col){return `<div class="addr"><div class="k" style="color:${col}">${I(ic,13)}${k}</div><b>${esc(p.name)}</b><span>${esc(p.line)}, ${cityN(p.city)} ${esc(p.pc)}</span><br><small>${esc(p.contact||'')}</small></div>`}

function drvJobs(){return S.jobs.filter(j=>j.driver===UI.drv.id)}
const pending=ref=>S.queue.find(a=>a.ref===ref);
function drvScreen(){
 const U=UI.drv,d=D(U.id);
 if(!U.logged)return `<div class="login-ph">${LOGO(52)}<h2 style="font-size:26px;font-weight:800;line-height:1.1">Northway<br>Driver</h2><p style="margin:0;color:rgba(255,255,255,.7)">Sign in to see today's jobs.</p>
  <div><div class="d-lab" style="color:#fff">Driver</div><input class="d-in" value="${esc(d.name)}" readonly></div><div><div class="d-lab" style="color:#fff">PIN</div><input class="d-in" type="password" value="0000" readonly aria-label="Demo PIN"></div>
  <button class="d-btn acc" data-act="drvIn">Sign in</button><small style="color:rgba(255,255,255,.55);text-align:center">Prototype: sign-in is simulated</small></div>`;
 const j=U.ref&&J(U.ref);
 if(U.screen==='job'&&j)return drvJob(j);
 if(U.screen==='collect'&&j)return drvCollect(j);
 if(U.screen==='pod'&&j)return drvPod(j);
 if(U.screen==='fail'&&j)return drvFail(j);
 if(U.screen==='done'&&j)return drvDone(j);
 const js=drvJobs();const act=js.filter(j=>['allocated','collected','in_transit'].includes(j.status)).sort((a,b)=>({in_transit:0,collected:1,allocated:2}[a.status]-{in_transit:0,collected:1,allocated:2}[b.status]));
 const done=js.filter(j=>['delivered','failed'].includes(j.status)&&isToday((j.pod||j.failure).t));
 const nxt={allocated:'Collect',collected:'Start journey',in_transit:'Deliver'};
 return `<div class="d-head"><small>${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</small><h2>Hi ${esc(d.name.split(' ')[0])}</h2><small>${esc(d.vehicle)} · ${esc(d.reg)}</small></div>
 <div class="d-body"><div class="d-sec">Today's jobs (${act.length})</div>
 ${act.length?act.map(j=>{const pq=pending(j.ref);return `<div class="d-card tap" data-act="drvOpen" data-ref="${j.ref}"><div class="row between"><span class="ref">${j.ref}</span>${pq?`<span class="chip warn">Saved offline</span>`:chip(j.status)}</div>
  <div class="mt8" style="font-weight:700">${esc(j.status==='allocated'?j.from.name:j.to.name)}</div><small style="color:#64748b">${esc(j.status==='allocated'?j.from.line:j.to.line)}, ${cityN(j.status==='allocated'?j.from.city:j.to.city)}</small>
  <div class="row between mt8" style="font-size:12px;color:#475569"><span class="row gap4">${I('clock',13)}${j.status==='allocated'?'Collect by '+fmt.time(j.collectBy):'Deliver by '+fmt.time(j.deliverBy)}</span><b style="color:#1d4ed8" class="row gap4">${pq?'Waiting for signal':nxt[j.status]} ${I('chev',14)}</b></div></div>`}).join(''):`<div class="d-card" style="text-align:center;color:#64748b">No jobs right now. New allocations appear here automatically.</div>`}
 ${done.length?`<div class="d-sec">Completed today (${done.length})</div>${done.map(j=>`<div class="d-card" style="opacity:.75"><div class="row between"><span class="ref">${j.ref}</span>${chip(j.status)}</div><small style="color:#64748b">${esc(j.to.name)} · ${fmt.time((j.pod||j.failure).t)}</small></div>`).join('')}`:''}
 <button class="d-btn" style="background:#fff;color:#0b2545;border:1px solid #e2e8f0;height:44px;font-size:14px;margin-top:auto" data-act="drvOut">${I('logout',16)} Sign out</button>
 </div>`;
}
function dHead(title,sub){return `<div class="d-head"><button class="back" data-act="drvBack">${I('back',16)} Back</button><h2 class="mono" style="font-size:20px">${title}</h2><small>${sub}</small></div>`}
function drvJob(j){

 else if(j.status==='allocated')foot=`<button class="d-btn acc" data-act="drvGo" data-s="collect">${I('camera',18)} Arrived — confirm collection</button>`;

 <div class="d-body">
  ${j.notes?`<div class="d-note"><b>Job notes</b><br>${esc(j.notes)}</div>`:''}
  ${addr('COLLECTION',j.from,'#6d28d9','#ede9fe','box')}

}

function initSig(){
 const c=$('#sig');if(!c)return;const d=UI.drv.draft;
 const ratio=window.devicePixelRatio||1;const w=c.clientWidth,h=c.clientHeight;c.width=w*ratio;c.height=h*ratio;
 const g=c.getContext('2d');g.scale(ratio,ratio);g.lineWidth=2.4;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#1e3a8a';
 const hint=()=>{g.save();g.fillStyle='#cbd5e1';g.font='600 13px Inter,sans-serif';g.fillText('Sign here',14,h-14);g.fillRect(14,h-34,w-28,1);g.restore()};
 if(d.sig){const im=new Image();im.onload=()=>g.drawImage(im,0,0,w,h);im.src=d.sig}else hint();
 let on=false,last=null;const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 c.onpointerdown=e=>{if(!d.sig&&!on){g.clearRect(0,0,w,h)}on=true;last=pos(e);c.setPointerCapture(e.pointerId);e.preventDefault()};
 c.onpointermove=e=>{if(!on)return;const p=pos(e);g.beginPath();g.moveTo(last[0],last[1]);g.lineTo(p[0],p[1]);g.stroke();last=p};
 c.onpointerup=c.onpointercancel=e=>{try{c.releasePointerCapture(e.pointerId)}catch(_){}if(!on)return;on=false;d.sig=c.toDataURL('image/png');updPod()};
 c._clear=()=>{g.clearRect(0,0,w,h);d.sig=null;hint();updPod()};
}

  const j={ref,cust:c.id,driver:null,status:'booked',service:svc,from:{name:f.get('fn'),line:f.get('fl')||'—',city:f.get('fc'),pc:'',contact:c.contact},to:{name:f.get('tn'),line:f.get('tl'),city:f.get('tc'),pc:'',contact:''},goods:f.get('g'),pieces:+f.get('p')||1,weight:+f.get('w')||1,created:n,collectBy:Math.max(day,n+HR),deliverBy:Math.max(day,n+HR)+(svc==='Next-day'?DAY:6*HR),progress:0,notes:f.get('n')||'',photos:{collection:[],delivery:[]},pod:null,failure:null,events:[ev(n,'booked','Booking received via customer portal','Customer')]};
  S.jobs.push(j);sendEmail(j,'booked');save();toast(`Booking ${ref} confirmed`,'Now waiting in the operations dashboard for a driver','ok');UI.custTab='job';UI.custJob=ref;render();window.scrollTo(0,0)}
 if(e.target.id==='trackForm'){e.preventDefault();const v=new FormData(e.target).get('r');if(v)go('#/track/'+String(v).trim().toUpperCase())}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(UI.modal){UI.modal=null;render()}else if(UI.adminJob){UI.adminJob=null;render()}}});

// live simulation tick
let tickN=0,lastAct='';
setInterval(()=>{
 let moved=false;
 for(const j of S.jobs)if(j.status==='in_transit'&&j.progress<.965){j.progress=Math.min(.965,j.progress+20/(durMin(j)*60));moved=true}
 $$('[data-eta]').forEach(el=>{const j=J(el.dataset.eta);if(j&&j.status==='in_transit')el.textContent=fmt.time(etaT(j))});
 $$('svg [data-veh]').forEach(el=>{const j=J(el.dataset.veh);if(j){const [x,y]=vehPos(j);el.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)})`)}});
 $$('[data-prog]').forEach(el=>{const j=J(el.dataset.prog);if(j)el.style.width=(j.progress*100).toFixed(1)+'%'});
 if(SC)SC.sync();
 const sb=$('.sbar span');if(sb)sb.textContent=fmt.time(Date.now());
 if(moved&&++tickN%10===0)save();
},1000);

render();
</script>
